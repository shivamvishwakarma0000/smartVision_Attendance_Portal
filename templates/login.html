<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartVision - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* Replace 'login_background.png' with the actual filename of your image */
            background-image: url("{{ url_for('static', filename='images/login_background.png') }}");
            background-size: cover; /* Cover the entire page */
            background-position: center; /* Center the image */
            background-repeat: no-repeat; /* Do not repeat the image */
            height: 100vh; /* Make body take full viewport height */
            margin: 0; /* Remove default body margin */
        }
        /* Style for the login container */
        .login-container {
            /* Adjust opacity here for transparency (0.7 means 70% opaque) */
            background-color: rgba(255, 255, 255, 0.7); /* White with 70% opacity */
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); /* Slightly stronger shadow */

            /* Positioning for the login form */
            position: absolute; /* Allows precise positioning */
            left: 10%; /* Adjust as needed, 10% from the left edge */
            top: 50%; /* Start at 50% from top */
            transform: translateY(-50%); /* Adjust to truly center vertically */
            width: 24rem; /* Slightly wider card for better appearance */
            max-width: 90%; /* Ensure it's responsive on smaller screens */
        }

        /* Adjust the alert messages if they appear in the login form */
        .alert {
            font-size: 0.9rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 768px) {
            .login-container {
                left: 50%; /* Center horizontally on small screens */
                transform: translate(-50%, -50%); /* Center perfectly */
            }
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-start align-items-center" style="height: 100vh;">
        <!-- The login-container now has absolute positioning, so it's not directly affected by this flexbox,
             but we keep 'align-items-center' for general vertical alignment of other potential elements if any. --><div class="login-container">
             <h3 class="card-title text-center mb-4">SmartVision Login</h3>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                        <div class="alert alert-{{ category }}" role="alert">
                            {{ message }}
                        </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form method="POST" action="">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>
        </div>
    </div>
</body>
</html>
