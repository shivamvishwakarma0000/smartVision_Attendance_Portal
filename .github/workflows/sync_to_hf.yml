name: Sync to Hugging Face Hub

on:
  push:
    branches: [ master, main ]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push --force https://shivan8858:$HF_TOKEN@huggingface.co/spaces/shivan8858/smartVision_Attendance_Portal HEAD:main
          else
            echo "HF_TOKEN secret not set in GitHub repository settings. Skipping HF push."
          fi
