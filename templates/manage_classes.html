{% extends "base.html" %}
{% block title %}Manage Classes{% endblock %}

{% block content %}
<div class="row">
    <!-- Form to Add a New Class -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>Add New Class</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="">
                    <div class="mb-3">
                        <label for="class_name" class="form-label">Class Name</label>
                        <input type="text" class="form-control" id="class_name" name="class_name" placeholder="e.g., Computer Science Year 1" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Class</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Table of Existing Classes -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>Existing Classes</h4>
            </div>
            <div class="card-body">
                <ul class="list-group">
                    {% for class_item in classes %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ class_item.name }}
                        <form action="{{ url_for('delete_class', class_id=class_item.id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this class? This will also delete all students and subjects associated with it.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </li>
                    {% else %}
                    <li class="list-group-item text-center">No classes added yet.</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
