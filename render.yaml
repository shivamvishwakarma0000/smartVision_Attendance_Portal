services:
  - type: web
    name: smartvision-attendance-portal
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    
    # Define environment variables
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/instance/smartvision.db
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

